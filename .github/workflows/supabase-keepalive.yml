name: Supabase keep-alive

# A free Supabase project pauses after 7 days without requests. One cheap read every
# 3 days keeps it awake (the day-of-month step restarts each month, so gaps stay under 7 days).
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call nickname_taken
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY repository variables are not set, nothing to keep alive"
            exit 0
          fi
          # Legacy anon keys are JWTs and also go in Authorization; new publishable keys go in apikey only.
          headers=(-H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json")
          case "$SUPABASE_ANON_KEY" in
            eyJ*) headers+=(-H "Authorization: Bearer $SUPABASE_ANON_KEY") ;;
          esac
          curl --fail --silent --show-error --max-time 30 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/nickname_taken" \
            "${headers[@]}" \
            -d '{"nick_key":"keepalive"}'
          echo
