<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Strike: Zero G</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600&family=Fira+Sans+Extra+Condensed:wght@700;800;900&family=Fira+Sans:wght@400;500;600&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // "Hazard Bay" UI theme: station steel + hazard-tape yellow, taken from the in-game platforms
    tailwind.config = {
      theme: {
        extend: {
          // Desktop layout in a laptop-height window (a 14" MacBook shows ~860 px): setup tightens up
          screens: {
            short: { raw: '(min-width: 1024px) and (max-height: 960px)' },
            // A phone in landscape: the in-game overlays shrink to fit under the phone HUD's top bar
            phone: { raw: '(max-height: 500px)' },
          },
          colors: {
            bay: {
              ink: '#1A1D21', panel: '#22262C', steel: '#2B3038', plate: '#3C434D', edge: '#4A525E',
              hazard: '#FFC21A', signal: '#FF4D2E', chalk: '#ECE9E2', dust: '#B7B2A8', deep: '#0E1116', bronze: '#D08A4A',
            },
          },
          fontFamily: {
            // Big Shoulders and Barlow have no Cyrillic: Russian text falls back to Fira per glyph
            display: ['"Big Shoulders Display"', '"Fira Sans Extra Condensed"', 'sans-serif'],
            body: ['Barlow', '"Fira Sans"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020617;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
    }

    /* Custom Scanline Effect */
    .scanlines {
      background: linear-gradient(to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2));
      background-size: 100% 4px;
      position: absolute;
      pointer-events: none;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
    }

    .grid-bg {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    /* HP Gain Floating Animation */
    @keyframes float {
      0% {
        opacity: 1;
        transform: translateY(0px);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "pixi.js": "https://aistudiocdn.com/pixi.js@^8.1.0/dist/pixi.mjs"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
