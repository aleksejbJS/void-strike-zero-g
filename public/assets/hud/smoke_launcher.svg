<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 103" width="240" height="103">
  <!-- Smoke launcher HUD icon: the grenade launcher's silhouette in gunmetal grey with a puff at the muzzle -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca3af"/>
      <stop offset="0.35" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="drum" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#1f2937"/>
    </radialGradient>
    <radialGradient id="puff" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="0.6" stop-color="#d1d5db"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </radialGradient>
  </defs>

  <!-- Stock -->
  <path d="M6 38 L46 34 L52 44 L50 60 L40 70 L26 70 L22 60 L10 58 Z" fill="url(#dark)" stroke="#0b0f17" stroke-width="2"/>
  <path d="M12 42 L44 39" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Receiver and barrel -->
  <rect x="46" y="30" width="120" height="30" rx="5" fill="url(#metal)" stroke="#0b0f17" stroke-width="2"/>
  <rect x="160" y="34" width="38" height="20" rx="3" fill="url(#dark)" stroke="#0b0f17" stroke-width="2"/>
  <rect x="194" y="31" width="10" height="26" rx="2" fill="#374151" stroke="#0b0f17" stroke-width="2"/>
  <path d="M52 35 L160 35" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M70 52 L150 52" stroke="#9ca3af" stroke-width="1.5" opacity="0.6"/>

  <!-- Sight -->
  <rect x="104" y="18" width="28" height="12" rx="3" fill="url(#dark)" stroke="#0b0f17" stroke-width="2"/>
  <circle cx="132" cy="24" r="3" fill="#e5e7eb"/>

  <!-- Pistol grip and foregrip -->
  <path d="M62 58 L80 58 L74 86 L58 86 Z" fill="url(#dark)" stroke="#0b0f17" stroke-width="2"/>
  <path d="M146 58 L158 58 L156 76 L146 76 Z" fill="url(#dark)" stroke="#0b0f17" stroke-width="2"/>

  <!-- Drum with grey smoke canisters -->
  <circle cx="112" cy="70" r="24" fill="url(#drum)" stroke="#0b0f17" stroke-width="2"/>
  <g stroke="#0b0f17" stroke-width="1.5">
    <circle cx="112" cy="56" r="6" fill="#9ca3af"/>
    <circle cx="124" cy="63" r="6" fill="#d1d5db"/>
    <circle cx="124" cy="77" r="6" fill="#9ca3af"/>
    <circle cx="112" cy="84" r="6" fill="#d1d5db"/>
    <circle cx="100" cy="77" r="6" fill="#9ca3af"/>
    <circle cx="100" cy="63" r="6" fill="#d1d5db"/>
    <circle cx="112" cy="70" r="5" fill="#374151"/>
  </g>

  <!-- Puff of smoke at the muzzle -->
  <g fill="#4b5563">
    <circle cx="216" cy="40" r="14.5"/>
    <circle cx="228" cy="28" r="11.5"/>
    <circle cx="212" cy="22" r="12.5"/>
    <circle cx="226" cy="49" r="10.5"/>
  </g>
  <g fill="url(#puff)">
    <circle cx="216" cy="40" r="13"/>
    <circle cx="228" cy="28" r="10"/>
    <circle cx="212" cy="22" r="11"/>
    <circle cx="226" cy="49" r="9"/>
  </g>
</svg>
